name: update profile visuals

on:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Asia/Ho_Chi_Minh"
  workflow_dispatch:

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      GITHUB_USERNAME: ${{ github.repository_owner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quan trọng: Lấy toàn bộ lịch sử để có thể pull/rebase

      - name: generate SVG
        uses: cyprieng/github-breakout@v1.0.0
        with:
          github_username: ${{ github.repository_owner }}

      - name: Move generated SVGs
        run: |
          mkdir -p images
          mv output/light.svg images/breakout-light.svg
          mv output/dark.svg images/breakout-dark.svg

      - name: Build contribution signal
        run: python3 scripts/build_contribution_graph.py

      - name: Build GitHub stats
        run: python3 scripts/build_stats.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push SVGs
        run: |
          git add images/breakout-light.svg images/breakout-dark.svg images/contribution-light.svg images/contribution-dark.svg images/stats-light.svg images/stats-dark.svg
          if git commit -m "chore: update profile visuals"; then
            git push
          else
            echo "No changes to commit"
          fi
