name: generate breakout svg

on:
  schedule:
    - cron: "0 0 * * *"  # chạy mỗi ngày lúc 00:00
  workflow_dispatch:

jobs:
  generate-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quan trọng: Lấy toàn bộ lịch sử để có thể pull/rebase

      - name: generate SVG
        uses: cyprieng/github-breakout@v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          github_username: ${{ github.repository_owner }}

      - name: Move generated SVGs
        run: |
          mkdir -p images
          mv output/light.svg images/breakout-light.svg
          mv output/dark.svg images/breakout-dark.svg

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push SVGs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add images/breakout-light.svg images/breakout-dark.svg
          # Commit nếu có thay đổi, nếu không thì bỏ qua
          if git commit -m "chore: update breakout SVGs"; then
            # Sử dụng --force để ghi đè hoàn toàn, giải quyết lỗi xung đột (Conflict)
            git push --force https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git HEAD:master
          else
            echo "No changes to commit"
          fi
