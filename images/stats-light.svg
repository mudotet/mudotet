<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="310" viewBox="0 0 1180 310" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Phan Thanh Tu — animated GitHub stats</title>
  <desc id="desc">Live public GitHub statistics for @mudotet: repositories, active days, languages, followers, and forks.</desc>
  <defs>
    <clipPath id="canvas"><rect width="1180" height="310" rx="28"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF4F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"><animate attributeName="stop-color" values="#2563EB;#06B6D4;#2563EB" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset=".55" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#10B981;#06B6D4" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#2563EB;#10B981" dur="8s" repeatCount="indefinite"/></stop>
      <animate attributeName="x1" values="-.3;.35;-.3" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values=".7;1.35;.7" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#06B6D4" stop-opacity=".075"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".74" numOctaves="2" seed="23"><animate attributeName="baseFrequency" values=".72;.78;.72" dur="9s" repeatCount="indefinite"/></feTurbulence><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <g clip-path="url(#canvas)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="1180" height="310" fill="url(#bg)"/>
    <ellipse cx="940" cy="12" rx="360" ry="175" fill="url(#glow)"><animateTransform attributeName="transform" type="translate" values="0 0;-80 25;0 0" dur="14s" repeatCount="indefinite"/></ellipse>
    <rect x="20" y="20" width="1140" height="270" rx="22" fill="#FFFFFF" fill-opacity=".74" stroke="#0F172A" stroke-opacity=".07"/>
    <rect x="21" y="21" width="1138" height="268" rx="21" fill="none" stroke="url(#accent)" stroke-opacity=".36" stroke-dasharray="70 250"><animate attributeName="stroke-dashoffset" values="0;-640" dur="8s" repeatCount="indefinite"/></rect>
    <circle cx="48" cy="49" r="4" fill="#10B981" filter="url(#soft)"><animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="62" y="53" fill="#0F172A" font-size="12" font-weight="700" letter-spacing="1.7">GITHUB STATS</text>
    <text x="180" y="53" fill="#64748B" font-size="9.5" letter-spacing=".8">PUBLIC SIGNAL / UPDATED DAILY</text>
    <text x="1132" y="53" text-anchor="end" fill="#475569" font-size="10">@mudotet · LIVE DATA</text>

    <g transform="translate(42 92)">
      <rect width="202" height="126" rx="18" fill="#FFFFFF" fill-opacity=".8" stroke="#0F172A" stroke-opacity=".08"/>
      <rect width="202" height="126" rx="18" fill="none" stroke="url(#accent)" stroke-opacity=".08">
        <animate attributeName="stroke-opacity" values=".08;.48;.08" dur="5s" begin="-0.00s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(20 18)" color="#06B6D4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 6h14M3 2v8M11 2v8" fill="none" stroke="currentColor"/></g>
      <text x="20" y="55" fill="#475569" font-size="9.5" letter-spacing="1.35">PUBLIC REPOS</text>
      <text x="20" y="94" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="760">33
        <animate attributeName="opacity" values=".78;1;.78" dur="4.5s" begin="-0.00s" repeatCount="indefinite"/>
      </text>
      <text x="75" y="92" fill="#64748B" font-size="9.5">repositories</text>
      <rect x="20" y="109" width="162" height="2" rx="1" fill="#0F172A" fill-opacity=".07"/>
      <rect x="20" y="109" width="0" height="2" rx="1" fill="url(#accent)">
        <animate attributeName="width" values="0;162;162;0" keyTimes="0;.35;.82;1" dur="7s" begin="-0.00s" repeatCount="indefinite"/>
      </rect>
    </g><g transform="translate(262 92)">
      <rect width="202" height="126" rx="18" fill="#FFFFFF" fill-opacity=".8" stroke="#0F172A" stroke-opacity=".08"/>
      <rect width="202" height="126" rx="18" fill="none" stroke="url(#accent)" stroke-opacity=".08">
        <animate attributeName="stroke-opacity" values=".08;.48;.08" dur="5s" begin="-0.55s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(20 18)" color="#06B6D4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 7h4l2-5 3 10 2-5h4" fill="none" stroke="currentColor"/></g>
      <text x="20" y="55" fill="#475569" font-size="9.5" letter-spacing="1.35">ACTIVE DAYS</text>
      <text x="20" y="94" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="760">55
        <animate attributeName="opacity" values=".78;1;.78" dur="4.5s" begin="-0.55s" repeatCount="indefinite"/>
      </text>
      <text x="75" y="92" fill="#64748B" font-size="9.5">last 53 weeks</text>
      <rect x="20" y="109" width="162" height="2" rx="1" fill="#0F172A" fill-opacity=".07"/>
      <rect x="20" y="109" width="0" height="2" rx="1" fill="url(#accent)">
        <animate attributeName="width" values="0;162;162;0" keyTimes="0;.35;.82;1" dur="7s" begin="-0.55s" repeatCount="indefinite"/>
      </rect>
    </g><g transform="translate(482 92)">
      <rect width="202" height="126" rx="18" fill="#FFFFFF" fill-opacity=".8" stroke="#0F172A" stroke-opacity=".08"/>
      <rect width="202" height="126" rx="18" fill="none" stroke="url(#accent)" stroke-opacity=".08">
        <animate attributeName="stroke-opacity" values=".08;.48;.08" dur="5s" begin="-1.10s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(20 18)" color="#06B6D4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="m4 2-4 5 4 5m7-10 4 5-4 5" fill="none" stroke="currentColor"/></g>
      <text x="20" y="55" fill="#475569" font-size="9.5" letter-spacing="1.35">LANGUAGES</text>
      <text x="20" y="94" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="760">11
        <animate attributeName="opacity" values=".78;1;.78" dur="4.5s" begin="-1.10s" repeatCount="indefinite"/>
      </text>
      <text x="75" y="92" fill="#64748B" font-size="9.5">across public repos</text>
      <rect x="20" y="109" width="162" height="2" rx="1" fill="#0F172A" fill-opacity=".07"/>
      <rect x="20" y="109" width="0" height="2" rx="1" fill="url(#accent)">
        <animate attributeName="width" values="0;162;162;0" keyTimes="0;.35;.82;1" dur="7s" begin="-1.10s" repeatCount="indefinite"/>
      </rect>
    </g><g transform="translate(702 92)">
      <rect width="202" height="126" rx="18" fill="#FFFFFF" fill-opacity=".8" stroke="#0F172A" stroke-opacity=".08"/>
      <rect width="202" height="126" rx="18" fill="none" stroke="url(#accent)" stroke-opacity=".08">
        <animate attributeName="stroke-opacity" values=".08;.48;.08" dur="5s" begin="-1.65s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(20 18)" color="#06B6D4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="5" r="3" fill="none" stroke="currentColor"/><circle cx="12" cy="6" r="2.5" fill="none" stroke="currentColor"/><path d="M0 14c1-4 9-4 10 0m0-2c2-2 5-1 6 2" fill="none" stroke="currentColor"/></g>
      <text x="20" y="55" fill="#475569" font-size="9.5" letter-spacing="1.35">FOLLOWERS</text>
      <text x="20" y="94" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="760">3
        <animate attributeName="opacity" values=".78;1;.78" dur="4.5s" begin="-1.65s" repeatCount="indefinite"/>
      </text>
      <text x="75" y="92" fill="#64748B" font-size="9.5">public network</text>
      <rect x="20" y="109" width="162" height="2" rx="1" fill="#0F172A" fill-opacity=".07"/>
      <rect x="20" y="109" width="0" height="2" rx="1" fill="url(#accent)">
        <animate attributeName="width" values="0;162;162;0" keyTimes="0;.35;.82;1" dur="7s" begin="-1.65s" repeatCount="indefinite"/>
      </rect>
    </g><g transform="translate(922 92)">
      <rect width="202" height="126" rx="18" fill="#FFFFFF" fill-opacity=".8" stroke="#0F172A" stroke-opacity=".08"/>
      <rect width="202" height="126" rx="18" fill="none" stroke="url(#accent)" stroke-opacity=".08">
        <animate attributeName="stroke-opacity" values=".08;.48;.08" dur="5s" begin="-2.20s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(20 18)" color="#06B6D4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1v9m0 0-5-3m5 3 5-3M3 7V3m10 4V3" fill="none" stroke="currentColor"/><circle cx="3" cy="2" r="1.5"/><circle cx="13" cy="2" r="1.5"/><circle cx="8" cy="12" r="1.5"/></g>
      <text x="20" y="55" fill="#475569" font-size="9.5" letter-spacing="1.35">FORKS</text>
      <text x="20" y="94" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="760">2
        <animate attributeName="opacity" values=".78;1;.78" dur="4.5s" begin="-2.20s" repeatCount="indefinite"/>
      </text>
      <text x="75" y="92" fill="#64748B" font-size="9.5">work reused</text>
      <rect x="20" y="109" width="162" height="2" rx="1" fill="#0F172A" fill-opacity=".07"/>
      <rect x="20" y="109" width="0" height="2" rx="1" fill="url(#accent)">
        <animate attributeName="width" values="0;162;162;0" keyTimes="0;.35;.82;1" dur="7s" begin="-2.20s" repeatCount="indefinite"/>
      </rect>
    </g>

    <path id="signal" d="M58 252 C260 232 380 276 570 252 S880 228 1118 252" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity=".42" stroke-dasharray="5 9"><animate attributeName="stroke-dashoffset" values="0;-56" dur="6s" repeatCount="indefinite"/></path>
    <circle r="4" fill="#06B6D4" filter="url(#soft)"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#signal"/></animateMotion><animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/></circle>
    <g fill="#475569" font-size="9" letter-spacing=".8">
      <text x="58" y="276">API</text><text x="280" y="276">BUILD</text><text x="548" y="276">SHIP</text><text x="812" y="276">LEARN</text><text x="1081" y="276">REPEAT</text>
    </g>
    <rect width="1180" height="310" filter="url(#noise)" opacity=".01"/>
  </g>
</svg>
